{% extends 'base.html' %}{% block content %}<div class="page-head"><span class="eyebrow">PATIENT SERVICES</span><h1>Book an Appointment</h1><p>Complete the form to reserve a demo hospital appointment.</p></div><div class="card"><form method="post"><div class="form-grid"><div><label>Patient full name</label><input name="patient" required placeholder="Your full name"></div><div><label>Email</label><input type="email" name="email" required placeholder="name@example.com"></div><div><label>Phone number</label><input name="phone" required placeholder="10-digit phone"></div><div><label>Age</label><input name="age" type="number" min="1" max="120" required></div><div><label>Department</label><select name="department" required><option value="">Select department</option>{% for d in departments %}<option value="{{d}}">{{d}} — {{doctors[d]}}</option>{% endfor %}</select></div><div><label>Appointment date</label><input name="appointment_date" type="date" required></div><div><label>Appointment time</label><input name="appointment_time" type="time" required></div><div class="wide"><label>Symptoms / reason for visit</label><textarea name="symptoms" required placeholder="Briefly describe your symptoms"></textarea></div></div><button class="btn" type="submit">Confirm Appointment →</button></form></div>{% endblock %}
